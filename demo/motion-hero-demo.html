<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Motion.dev Demo — Hero Entrance</title>
<meta name="description" content="Sample hero component built with the motion-dev-animations skill: fade-up entrance and a hover scale CTA, with prefers-reduced-motion support." />
<style>
  :root {
    --bg: #0b0b0f;
    --text: #f5f5f7;
    --text-muted: #a1a1aa;
    --accent: #f5f5f7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hero {
    max-width: 640px;
    padding: 2rem;
    text-align: center;
  }

  .hero h1 {
    font-size: clamp(2.5rem, 6vw, 4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 1.25rem;
    /* Prevents layout shift before the animation runs */
    opacity: 0;
  }

  .hero p {
    font-size: 1.25rem;
    color: var(--text-muted);
    margin-bottom: 2.25rem;
    opacity: 0;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 0 2rem;
    border-radius: 999px;
    background: var(--accent);
    color: #0b0b0f;
    font-weight: 600;
    font-size: 1rem;
    border: none;
    cursor: pointer;
    opacity: 0;
  }

  /* If JS never loads, don't leave content invisible */
  .no-js .hero h1,
  .no-js .hero p,
  .no-js .cta {
    opacity: 1;
  }
</style>
</head>
<body class="no-js">
<main class="hero">
  <h1 id="title">Build motion that feels alive</h1>
  <p id="subtitle">A sample hero entrance animation generated with the motion-dev-animations skill.</p>
  <button class="cta" id="cta">Get started</button>
</main>

<script type="module">
  import { animate, hover, stagger } from "./vendor/motion.bundle.js";

  document.body.classList.remove("no-js");

  const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const title = document.getElementById("title");
  const subtitle = document.getElementById("subtitle");
  const cta = document.getElementById("cta");

  if (prefersReducedMotion) {
    // Skip motion entirely; just reveal the content.
    animate([title, subtitle, cta], { opacity: 1 }, { duration: 0.01 });
  } else {
    // Entrance: fade + slide up, staggered title -> subtitle -> CTA
    animate(
      [title, subtitle, cta],
      { opacity: [0, 1], y: [20, 0] },
      { duration: 0.8, easing: [0.22, 1, 0.36, 1], delay: stagger(0.1) }
    );

    // Gesture: whileHover-equivalent scale on the CTA
    hover(cta, (element) => {
      const stop = animate(element, { scale: 1.05 }, { type: "spring", stiffness: 300, damping: 20 });
      return () => animate(element, { scale: 1 }, { type: "spring", stiffness: 300, damping: 20 });
    });
  }
</script>
</body>
</html>
